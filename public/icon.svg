<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Card shape -->
  <rect x="96" y="148" width="320" height="200" rx="24" fill="url(#card)" opacity="0.9"/>
  <!-- Card stripe -->
  <rect x="96" y="192" width="320" height="40" fill="url(#accent)" opacity="0.6"/>
  <!-- Dollar coin -->
  <circle cx="380" cy="320" r="56" fill="url(#accent)" opacity="0.95"/>
  <text x="380" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="64" fill="#1e1b4b">$</text>
  <!-- Chip -->
  <rect x="136" y="240" width="56" height="40" rx="6" fill="#fbbf24" opacity="0.85"/>
  <line x1="164" y1="240" x2="164" y2="280" stroke="#d97706" stroke-width="2" opacity="0.5"/>
  <line x1="136" y1="260" x2="192" y2="260" stroke="#d97706" stroke-width="2" opacity="0.5"/>
</svg>
